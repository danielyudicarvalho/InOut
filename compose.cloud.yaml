services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InOut: ${INOUT_CLOUD_DATABASE_URL:?Set the runtime connection in .env.cloud}
      ConnectionStrings__InOutDirect: ${INOUT_CLOUD_DIRECT_URL:?Set the direct connection in .env.cloud}
      Auth__Issuer: ${AUTH_ISSUER:?Set the public issuer}
      Auth__PublicOrigin: ${AUTH_PUBLIC_ORIGIN:?Set the web origin}
      Auth__WebClientSecret: ${AUTH_WEB_CLIENT_SECRET:?Set the web client secret}
      Database__PoolMode: session
      Cors__AllowedOrigins__0: http://localhost:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: inout-api
      Auth__Email__Delivery: ${AUTH_EMAIL_DELIVERY:-capture}
      Auth__Resend__ApiKey: ${RESEND_API_KEY:-}
      Auth__Email__From: ${AUTH_EMAIL_FROM:-InOut <noreply@inout.app>}
      Sentry__Dsn: ${SENTRY_DSN:-}
      PostHog__ApiKey: ${POSTHOG_API_KEY:-}
      PostHog__Host: ${POSTHOG_HOST:-https://us.i.posthog.com}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - api_logs:/var/log/inout
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Browser keys are baked in at build time: rebuild after changing them.
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    environment:
      API_BASE_URL: http://api:8080
      AUTH_WEB_CLIENT_SECRET: ${AUTH_WEB_CLIENT_SECRET:?Set the web client secret}
      BFF_SESSION_KEY: ${BFF_SESSION_KEY:?Set a 32-byte base64 key}
      PORT: 3000
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - api
    volumes:
      - web_logs:/var/log/inout
    restart: unless-stopped

volumes:
  api_logs:
  web_logs:
