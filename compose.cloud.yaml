services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InOut: ${INOUT_CLOUD_DATABASE_URL:?Set INOUT_CLOUD_DATABASE_URL in .env.cloud}
      Supabase__Jwt__Issuer: ${SUPABASE_URL:?Set SUPABASE_URL in .env.cloud}/auth/v1
      Supabase__Jwt__Audience: authenticated
      Cors__AllowedOrigins__0: http://localhost:8081
    ports:
      - 127.0.0.1:8080:8080
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.flutter
      args:
        SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env.cloud}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env.cloud}
        API_BASE_URL: http://localhost:8080
    ports:
      - 127.0.0.1:8081:80
    depends_on:
      - api
    restart: unless-stopped
