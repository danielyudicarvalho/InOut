# BFF / Next.js web app. Deploy separately: fly deploy -c fly.web.toml
# This file does not provision Fly resources.

app = 'inout-web'
# gru is an unapproved candidate. Do not treat it as an approved region.
primary_region = 'gru'

[build]
  dockerfile = 'frontend/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  HOSTNAME = '0.0.0.0'
  API_BASE_URL = 'http://inout-api.internal:8080'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
