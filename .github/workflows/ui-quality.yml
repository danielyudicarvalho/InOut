name: UI quality
on:
  push:
    paths:
      [
        "frontend/**",
        "mobile/**",
        "packages/identity/**",
        ".prettier*",
        ".github/workflows/ui-quality.yml",
      ]
  pull_request:
    paths:
      [
        "frontend/**",
        "mobile/**",
        "packages/identity/**",
        ".prettier*",
        ".github/workflows/ui-quality.yml",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run check
