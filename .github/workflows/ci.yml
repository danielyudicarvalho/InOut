name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secrets and logging privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository for secrets
        run: ./tool/check_secrets.sh

      - name: Check logging privacy
        run: bash ./tool/check_logging_privacy.sh

      - name: Check for hosted-auth runtime references
        run: bash ./tool/check_no_hosted_auth_runtime.sh

  database:
    name: Database migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: backend/global.json

      - name: Apply Fly schema to disposable Postgres
        working-directory: backend
        env:
          ConnectionStrings__InOutDirect: Host=localhost;Port=5432;Database=inout;Username=postgres;Password=postgres
        run: dotnet run --project src/InOut.Api -- migrate
