name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secrets and logging privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository for secrets
        run: ./tool/check_secrets.sh

      - name: Check logging privacy
        run: bash ./tool/check_logging_privacy.sh

  database:
    name: Database migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Lint database functions
        run: supabase db lint --schema public,private --level warning --fail-on error

      - name: Test schema and RLS policies
        run: supabase test db

      - name: Exercise encrypted backup and data restoration locally
        run: bash tool/backup_restore_drill.sh

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
