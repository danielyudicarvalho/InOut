name: Fly backup reminder

on:
  workflow_dispatch:

permissions:
  contents: read

# Protected environment is required. This job does not dump the database,
# does not upload PII, and must not be given a public DATABASE_URL.
jobs:
  remind:
    runs-on: ubuntu-latest
    environment: production-backup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse GitHub-runner dumps
        run: |
          echo 'Use Fly Managed Postgres backups and, if a logical dump is required, a fly proxy or Machine job.'
          echo 'tool/backup_database.sh refuses Fly hostnames. Artifacts with PII are not uploaded from CI.'
          test -z "${INOUT_BACKUP_DATABASE_URL:-}" || {
            echo 'Do not inject a live database URL into this workflow.' >&2
            exit 1
          }
