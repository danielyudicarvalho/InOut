services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InOut: Host=host.docker.internal;Port=5432;Database=inout;Username=inout_api_runtime;Password=${INOUT_DB_PASSWORD:?Set the runtime role password}
      ConnectionStrings__InOutDirect: Host=host.docker.internal;Port=5432;Database=inout;Username=postgres;Password=${INOUT_DIRECT_PASSWORD:?Set the migration password}
      Auth__Issuer: http://localhost:8080/
      Auth__PublicOrigin: http://localhost:3000
      Auth__Email__Delivery: capture
      Database__PoolMode: session
      Cors__AllowedOrigins__0: http://localhost:3000
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - api_logs:/var/log/inout
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      AUTH_WEB_CLIENT_SECRET: ${AUTH_WEB_CLIENT_SECRET:-dev-only-web-client-secret}
      BFF_SESSION_KEY: ${BFF_SESSION_KEY:-}
      PORT: 3000
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - api
    volumes:
      - web_logs:/var/log/inout
    restart: unless-stopped

volumes:
  api_logs:
  web_logs:
