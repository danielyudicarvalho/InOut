# fly.toml app configuration file generated for inout-api
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inout-api'
primary_region = 'gru'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  ASPNETCORE_URLS = 'http://+:8080'
  ASPNETCORE_ENVIRONMENT = 'Production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/health/live'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
