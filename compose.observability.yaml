services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: inout-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: inout-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    container_name: inout-tempo
    command: ["-config.file=/etc/tempo-config.yaml"]
    volumes:
      - ./docker/observability/tempo-config.yaml:/etc/tempo-config.yaml:ro
    ports:
      - "3200:3200"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: inout-loki
    command: ["-config.file=/etc/loki-config.yaml"]
    volumes:
      - ./docker/observability/loki-config.yaml:/etc/loki-config.yaml:ro
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: inout-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
